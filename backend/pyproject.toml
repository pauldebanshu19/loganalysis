[project]
name = "log-analyzer-api"
version = "1.0.0"
description = "Streaming log analyzer: which service is failing, and how badly."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "uvicorn[standard]>=0.32",
    "streaming-form-data>=1.19",
    "redis>=5.2",
    "prometheus-client>=0.21",
    # Gunicorn supervises the Uvicorn workers in production; it has no Windows
    # support, and on Windows a single `uvicorn` process is the dev story.
    "gunicorn>=23.0; sys_platform != 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "httpx>=0.28",
    "hypothesis>=6.112",
    "fakeredis>=2.26",
]
# Load testing pulls in a web framework of its own; kept apart so an ordinary
# `pip install -e .[dev]` stays small.
load = ["locust>=2.32"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["analyzer", "app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["benchmark: timing and memory guards; run with -m benchmark"]
filterwarnings = ["error::DeprecationWarning:app.*", "error::DeprecationWarning:analyzer.*"]

[tool.coverage.run]
source = ["analyzer", "app"]
omit = ["tests/*"]

[tool.coverage.report]
exclude_also = ['if TYPE_CHECKING:', 'raise NotImplementedError', '\.\.\.']
